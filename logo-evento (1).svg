<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1000" height="1000" viewBox="0 0 1000 1000"
     role="img" aria-labelledby="title desc">
  <title id="title">Ingeniero Químico — emblema circular</title>
  <desc id="desc">Recreación vectorial circular con aro morado, letras blancas, filigrana radial azul y dorada y un motivo floral de ocho lóbulos.</desc>
  <defs>
    <linearGradient id="purpleMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#381344"/>
      <stop offset="0.45" stop-color="#25072f"/>
      <stop offset="0.75" stop-color="#32103d"/>
      <stop offset="1" stop-color="#1d0829"/>
    </linearGradient>
    <radialGradient id="disc" cx="48%" cy="44%" r="72%">
      <stop offset="0" stop-color="#22334c"/>
      <stop offset="0.48" stop-color="#13243e"/>
      <stop offset="1" stop-color="#080e20"/>
    </radialGradient>
    <linearGradient id="cyanEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#57dcff"/>
      <stop offset="0.55" stop-color="#219de0"/>
      <stop offset="1" stop-color="#6bdfff"/>
    </linearGradient>
    <linearGradient id="innerCyan" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#d7f6ff"/>
      <stop offset="0.5" stop-color="#7cc9e9"/>
      <stop offset="1" stop-color="#a6e6f4"/>
    </linearGradient>
    <linearGradient id="goldRibbon" x1="0" y1="0" x2="1" y2="0.8">
      <stop offset="0" stop-color="#9f6b0a"/>
      <stop offset="0.18" stop-color="#dba820"/>
      <stop offset="0.43" stop-color="#ffe16a"/>
      <stop offset="0.66" stop-color="#f0c332"/>
      <stop offset="1" stop-color="#a46c0d"/>
    </linearGradient>
    <linearGradient id="goldFace" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#fff2a8"/>
      <stop offset="0.42" stop-color="#f2c63e"/>
      <stop offset="1" stop-color="#a97817"/>
    </linearGradient>
    <filter id="titleShadow" x="-20%" y="-30%" width="140%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"/>
      <feOffset dy="3" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.9"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="petalGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.72  0 1 0 0 0.48  0 0 1 0 0.05  0 0 0 0.34 0" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="topArc" d="M 66,500 A 434,434 0 0 1 934,500"/>
    <path id="bottomArc" d="M 66,500 A 434,434 0 0 0 934,500"/>
    <clipPath id="innerClip"><circle cx="500" cy="500" r="386"/></clipPath>
  </defs>

  <!-- Outer medallion and plum lettering band. -->
  <circle cx="500" cy="500" r="489" fill="#100c20"/>
  <circle cx="500" cy="500" r="484" fill="url(#purpleMetal)" stroke="url(#cyanEdge)" stroke-width="5"/>
  <circle cx="500" cy="500" r="472" fill="none" stroke="#10091c" stroke-width="2" opacity="0.8"/>

  <!-- Inner circular border: pale separator, dark seam and the blue inner rim. -->
  <circle cx="500" cy="500" r="398" fill="none" stroke="#0b1021" stroke-width="13"/>
  <circle cx="500" cy="500" r="394" fill="none" stroke="url(#innerCyan)" stroke-width="5"/>
