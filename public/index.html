<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JNTC Quiz · Proyector</title>
<style>
:root{--bg:#F4F7FB;--wm:#E8EEF7;--surface:#FFFFFF;--line:#DCE4F0;--navy:#111B54;--royal:#1565D8;--green:#236B28;--leaf:#5BA326;--red:#DC2626;--gold:#F5B700;--shadow:0 6px 20px rgba(17,27,84,.06)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--navy);overflow:hidden;display:flex;flex-direction:column}
.wm{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.top{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:8px 24px;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:58px;height:58px;flex:none}
.logo svg{width:100%;height:100%}
.brand-t{line-height:1.1;font-weight:800;font-size:1.15rem}
.brand-t .xx{color:var(--royal)}
.brand-t .jn{color:var(--navy)}
.brand-t .tc{display:block;color:var(--green);font-size:1rem}
.right{display:flex;align-items:center;gap:12px;font-weight:700}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:.95rem}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--red);margin-right:6px}
.dot.on{background:var(--leaf)}
button.snd{cursor:pointer;font:inherit;font-weight:700;font-size:.9rem;color:var(--navy);background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 14px}
button.snd:hover{background:var(--bg)}
#stage{position:relative;z-index:1;flex:1;min-height:0;padding:2vh 3vw;display:flex;flex-direction:column}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}

/* Lobby */
.lobby{flex:1;min-height:0;display:flex;flex-direction:column;gap:2vh}
.joinbox{display:flex;align-items:center;gap:3vw;padding:2vh 3vw}
.qr{width:26vh;height:26vh;flex:none;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.qr svg{width:100%;height:100%;display:block}
.steps{flex:1;display:flex;flex-direction:column;gap:1.2vh;min-width:0}
.step{font-size:clamp(1rem,1.8vw,1.7rem);font-weight:600}
.step .n{display:inline-flex;align-items:center;justify-content:center;width:1.6em;height:1.6em;border-radius:50%;background:var(--royal);color:#fff;font-weight:800;margin-right:.5em}
.step .url{color:var(--royal);word-break:break-all}
.pin{align-self:flex-start;background:var(--navy);color:#fff;font-weight:900;letter-spacing:.18em;font-size:clamp(2.2rem,7vw,5.6rem);padding:.1em .45em .1em .6em;border-radius:16px;line-height:1.15}
.wait{font-size:clamp(.95rem,1.5vw,1.4rem);font-weight:700;color:var(--green)}
.plist{flex:1;min-height:0;overflow:auto;display:flex;flex-wrap:wrap;align-content:flex-start;gap:1.2vh 1vw;padding:.5vh .2vw}
.pcard{background:#fff;border:1px solid var(--line);border-bottom:4px solid var(--royal);border-radius:12px;padding:.9vh 1.4vw;font-weight:800;font-size:clamp(.95rem,1.6vw,1.5rem);box-shadow:var(--shadow);animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
.pcard.off{opacity:.45}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}

/* Prepárate / lectura */
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vh;text-align:center}
.badge{background:var(--green);color:#fff;font-weight:800;border-radius:999px;padding:.5em 1.4em;font-size:clamp(1rem,2vw,1.8rem)}
.qn{font-size:clamp(1.4rem,3vw,2.8rem);font-weight:700}
.ready{font-size:clamp(3rem,9vw,8rem);font-weight:900;color:var(--royal);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.rtext{max-width:85vw;font-size:clamp(1.8rem,4.6vw,4.6rem);font-weight:800;line-height:1.2}
.rtrack{width:70vw;height:14px;background:var(--line);border-radius:99px;overflow:hidden}
.rfill{height:100%;width:100%;background:var(--royal);border-radius:99px;transition:width .12s linear}

/* Pregunta */
.qs{flex:1;min-height:0;display:grid;grid-template-rows:auto 1fr auto;gap:2vh}
.banner{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:2vh 2vw;text-align:center;font-weight:800;font-size:clamp(1.2rem,2.7vw,2.6rem);line-height:1.2;color:var(--navy)}
.mid{display:grid;grid-template-columns:150px 1fr 200px;gap:2vw;align-items:center;min-height:0}
.mid.res{grid-template-columns:1fr}
.timer{width:88px;height:88px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:2.4rem;font-weight:800;justify-self:center}
.timer.low{background:var(--red)}
.illus{height:100%;min-height:0;background:#fff;border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1vh;box-shadow:var(--shadow)}
.illus svg{flex:1;min-height:0;width:auto;max-width:100%}
.illus .cat{font-weight:800;color:var(--green);font-size:clamp(.9rem,1.5vw,1.4rem)}
.ansbadge{justify-self:center;text-align:center;background:var(--navy);color:#fff;border-radius:18px;padding:1.4vh 1.6vw;display:flex;flex-direction:column;align-items:center}
.ansbadge b{font-size:clamp(2rem,4vw,3.6rem);line-height:1}
.ansbadge span{font-weight:700}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:1.6vh 1.6vw;height:32vh}
.opt{display:flex;align-items:center;gap:1.2vw;padding:0 1.6vw;border-radius:14px;color:#fff;font-weight:800;border-bottom:6px solid rgba(0,0,0,.22);font-size:clamp(1rem,2.1vw,2rem);min-height:0;line-height:1.15;transition:opacity .4s,transform .4s}
.opt .shape{font-size:clamp(1.6rem,3.4vw,3.4rem);width:1.3em;text-align:center;flex:none}
.opt .check{margin-left:auto;font-size:clamp(1.8rem,3.4vw,3.2rem);flex:none}
.o0{background:var(--royal)}.o1{background:var(--green)}.o2{background:var(--navy)}.o3{background:var(--leaf)}
.opt.dim{opacity:.32}
.opt.ok{transform:scale(1.02);box-shadow:0 0 0 4px #fff,0 0 0 9px var(--gold),0 0 28px 8px rgba(245,183,0,.55)}
.chartcard{height:100%;min-height:0;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);display:flex;align-items:stretch;justify-content:center;gap:4vw;padding:1.6vh 2vw}
.col{flex:0 0 13vw;display:flex;flex-direction:column;align-items:center;min-height:0}
.num{font-size:clamp(1.4rem,3vw,2.8rem);font-weight:900;line-height:1.1}
.barwrap{flex:1;min-height:0;width:100%;display:flex;align-items:flex-end}
.bar{width:100%;height:0;min-height:6px;border-radius:10px 10px 0 0;transition:height .9s cubic-bezier(.2,.9,.3,1)}
.cshape{width:100%;text-align:center;color:#fff;font-weight:800;font-size:clamp(1.2rem,2.4vw,2.2rem);padding:.2em 0;border-radius:0 0 10px 10px}

/* Ranking */
.lb{width:100%;max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:1.6vh;flex:1;justify-content:center}
.lb h2{text-align:center;font-size:clamp(1.6rem,3.4vw,3rem);font-weight:900}
.lrow{display:grid;grid-template-columns:clamp(50px,6vw,80px) 1fr auto auto;align-items:center;gap:1.4vw;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:1.5vh 1.6vw;font-weight:800;font-size:clamp(1.1rem,2.4vw,2.2rem);animation:slide .5s both}
.lrow.first{background:var(--navy);color:#fff;border-color:var(--navy)}
.lrow .rk{font-size:1.2em;text-align:center}
.lrow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .st{font-size:.65em;background:#FFF1D6;color:#B45309;border-radius:999px;padding:.15em .7em}
.lrow.first .st{background:rgba(255,255,255,.18);color:#fff}
@keyframes slide{from{transform:translateX(-40px);opacity:0}to{transform:none;opacity:1}}

/* Podio */
.podh{text-align:center;font-size:clamp(1.8rem,4vw,3.6rem);font-weight:900}
.pod{flex:1;min-height:0;display:flex;align-items:flex-end;justify-content:center;gap:2vw}
.pcol{width:25vw;max-width:340px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.pname{font-weight:900;font-size:clamp(1.1rem,2.4vw,2.2rem);text-align:center;margin-bottom:.8vh;word-break:break-word}
.pblock{width:100%;border-radius:16px 16px 0 0;color:#fff;display:flex;flex-direction:column;align-items:center;padding-top:1.6vh;font-weight:900;transform-origin:bottom;animation:rise 1.1s cubic-bezier(.2,.9,.3,1) both}
.pblock .medal{font-size:clamp(2rem,5vw,4.4rem);line-height:1}
.pblock .pts{font-size:clamp(1rem,2vw,1.8rem);margin-top:.6vh}
.p1 .pblock{height:46vh;background:linear-gradient(180deg,var(--royal),var(--navy));animation-delay:.9s}
.p2 .pblock{height:34vh;background:var(--green);animation-delay:.5s}
.p3 .pblock{height:25vh;background:var(--leaf);animation-delay:.1s}
@keyframes rise{from{transform:scaleY(0);opacity:0}to{transform:scaleY(1);opacity:1}}
</style>
</head>
<body>
<svg class="wm" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <g fill="none" stroke="#E8EEF7">
    <circle cx="1060" cy="110" r="125" stroke-width="40" stroke-dasharray="30 22"/>
    <circle cx="1060" cy="110" r="88" stroke-width="22"/>
    <circle cx="110" cy="610" r="150" stroke-width="44" stroke-dasharray="34 26"/>
    <circle cx="110" cy="610" r="104" stroke-width="24"/>
  </g>
  <g fill="#E8EEF7">

</svg>

<header class="top">
  <div class="brand">
    <div class="logo" id="logo"></div>
    <div class="brand-t"><span class="xx">XX</span> <span class="jn">Jornada Nacional</span><span class="tc">Técnico-Científica</span></div>
  </div>
  <div class="right">
    <span class="chip"><span class="dot" id="dot"></span><span id="counter">Conectando…</span></span>
    <button class="snd" id="snd">🔊 Sonido ON</button>
  </div>
</header>
<main id="stage"></main>

<script src="/socket.io/socket.io.js"></script>
<script>
/* ===================== Utilidades ===================== */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SH = ['▲','◆','●','■'];

const logoSvg = k => '<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg"><defs><clipPath id="lc'+k+'"><circle cx="60" cy="60" r="40"/></clipPath><path id="lp'+k+'" d="M17 60A43 43 0 0 1 103 60"/></defs>'
 +'<circle cx="60" cy="60" r="55" fill="none" stroke="#236B28" stroke-width="9" stroke-dasharray="8.6 6"/>'
 +'<circle cx="60" cy="60" r="47" fill="none" stroke="#236B28" stroke-width="14"/>'
 +'<text font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="12" fill="#111B54" stroke="#fff" stroke-width=".6" paint-order="stroke" letter-spacing="3"><textPath href="#lp'+k+'" startOffset="50%" text-anchor="middle">JNTC</textPath></text>'
 +'<circle cx="60" cy="60" r="40" fill="#fff"/>'
 +'<g clip-path="url(#lc'+k+')"><path d="M20 92Q40 66 60 82T100 80V100H20Z" fill="#5BA326"/></g>'
 +'<rect x="53" y="30" width="14" height="52" rx="4" fill="#1565D8"/><rect x="50" y="26" width="20" height="8" rx="3" fill="#1565D8"/>'
 +'<rect x="55.5" y="50" width="9" height="9" rx="1" fill="#fff"/><path d="M58 50v-3M62 50v-3M58 59v3M62 59v3M55.5 53h-3M55.5 57h-3M64.5 53h3M64.5 57h3" stroke="#fff" stroke-width="1"/>'
 +'<polygon points="26,66 46,66 42,78 22,78" fill="#1565D8"/><path d="M32.5 66l-3 12M39 66l-3 12M24 72h20" stroke="#fff" stroke-width="1"/><path d="M34 78v6" stroke="#1565D8" stroke-width="2"/>'
 +'<path d="M84 80V64" stroke="#1565D8" stroke-width="2.5"/><path d="M84 68Q76 66 76 59Q84 59 84 68Z" fill="#1565D8"/><path d="M84 65Q92 63 92 56Q84 56 84 65Z" fill="#1565D8"/>'
 +'<path d="M90 98q17-2 19-19q-17 2-19 19z" fill="#5BA326"/></svg>';
$('#logo').innerHTML = logoSvg('a');

/* ===================== Generador de código QR (autocontenido) ===================== */
const QR = (function () {
  const ECC = [-1,10,16,26,18,24,16,18,22,22,26];   // bytes de corrección por bloque (nivel M)
  const BLK = [-1,1,1,1,2,2,4,4,4,5,5];             // número de bloques (nivel M)
  const rawModules = v => { let r = (16*v+128)*v+64; if (v >= 2) { const n = Math.floor(v/7)+2; r -= (25*n-10)*n-55; if (v >= 7) r -= 36; } return r; };
  const mul = (x, y) => { let z = 0; for (let i = 7; i >= 0; i--) { z = (z << 1) ^ ((z >>> 7) * 0x11D); z ^= ((y >>> i) & 1) * x; } return z; };
  function divisor(d) {
    const r = new Array(d).fill(0); r[d-1] = 1; let root = 1;
    for (let i = 0; i < d; i++) { for (let j = 0; j < r.length; j++) { r[j] = mul(r[j], root); if (j+1 < r.length) r[j] ^= r[j+1]; } root = mul(root, 2); }
    return r;
  }
  function remainder(data, div) {
    const r = div.map(() => 0);
    for (const b of data) { const f = b ^ r.shift(); r.push(0); div.forEach((c, i) => { r[i] ^= mul(c, f); }); }
    return r;
  }
  function encode(text) {
    const bytes = Array.from(new TextEncoder().encode(text));
    let ver, dataCw;
    for (ver = 1; ver <= 10; ver++) {
      const cap = Math.floor(rawModules(ver)/8) - ECC[ver]*BLK[ver];
      if (Math.ceil((4 + (ver < 10 ? 8 : 16) + 8*bytes.length)/8) <= cap) { dataCw = cap; break; }
    }
    if (!dataCw) throw new Error('Texto demasiado largo para el QR');
    const bits = []; const put = (v, n) => { for (let i = n-1; i >= 0; i--) bits.push((v >>> i) & 1); };
    put(4, 4); put(bytes.length, ver < 10 ? 8 : 16); bytes.forEach(b => put(b, 8));
    const capBits = dataCw*8; put(0, Math.min(4, capBits - bits.length));
    while (bits.length % 8) bits.push(0);
    for (let pad = 0xEC; bits.length < capBits; pad ^= 0xEC ^ 0x11) put(pad, 8);
    const data = []; for (let i = 0; i < bits.length; i += 8) { let b = 0; for (let j = 0; j < 8; j++) b = (b << 1) | bits[i+j]; data.push(b); }
    const nb = BLK[ver], el = ECC[ver], raw = Math.floor(rawModules(ver)/8), ns = nb - raw % nb, sl = Math.floor(raw/nb);
    const div = divisor(el), blocks = []; let k = 0;
    for (let i = 0; i < nb; i++) {
      const dl = sl - el + (i < ns ? 0 : 1); const d = data.slice(k, k+dl); k += dl;
      const e = remainder(d, div); if (i < ns) d.push(0); blocks.push(d.concat(e));
    }
    const all = [];
    for (let i = 0; i < blocks[0].length; i++) for (let j = 0; j < nb; j++) if (i !== sl - el || j >= ns) all.push(blocks[j][i]);

    const size = ver*4 + 17, m = [], f = [];
    for (let i = 0; i < size; i++) { m.push(new Array(size).fill(false)); f.push(new Array(size).fill(false)); }
    const setF = (x, y, v) => { m[y][x] = v; f[y][x] = true; };
    for (let i = 0; i < size; i++) { setF(6, i, i % 2 === 0); setF(i, 6, i % 2 === 0); }
    const finder = (cx, cy) => { for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) { const d = Math.max(Math.abs(dx), Math.abs(dy)), x = cx+dx, y = cy+dy; if (x >= 0 && x < size && y >= 0 && y < size) setF(x, y, d !== 2 && d !== 4); } };
    finder(3, 3); finder(size-4, 3); finder(3, size-4);
    if (ver > 1) {
      const n = Math.floor(ver/7) + 2, step = Math.ceil((ver*4+4)/(n*2-2))*2, pos = [6];
      for (let p = size-7; pos.length < n; p -= step) pos.splice(1, 0, p);
      for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
        if ((i === 0 && j === 0) || (i === 0 && j === n-1) || (i === n-1 && j === 0)) continue;
        for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) setF(pos[i]+dx, pos[j]+dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
      }
    }
    const fmt = mask => {
      const d = mask; let r = d; for (let i = 0; i < 10; i++) r = (r << 1) ^ ((r >>> 9) * 0x537);
      const b = ((d << 10) | r) ^ 0x5412, g = i => ((b >>> i) & 1) === 1;
      for (let i = 0; i <= 5; i++) setF(8, i, g(i));
      setF(8, 7, g(6)); setF(8, 8, g(7)); setF(7, 8, g(8));
      for (let i = 9; i < 15; i++) setF(14-i, 8, g(i));
      for (let i = 0; i < 8; i++) setF(size-1-i, 8, g(i));
      for (let i = 8; i < 15; i++) setF(8, size-15+i, g(i));
      setF(8, size-8, true);
    };
    fmt(0);
    if (ver >= 7) {
      let r = ver; for (let i = 0; i < 12; i++) r = (r << 1) ^ ((r >>> 11) * 0x1F25);
      const b = (ver << 12) | r;
      for (let i = 0; i < 18; i++) { const bit = ((b >>> i) & 1) === 1, a = size - 11 + i % 3, c = Math.floor(i/3); setF(a, c, bit); setF(c, a, bit); }
    }
    let idx = 0;
    for (let right = size-1; right >= 1; right -= 2) {
      if (right === 6) right = 5;
      for (let vert = 0; vert < size; vert++) for (let j = 0; j < 2; j++) {
        const x = right - j, up = ((right + 1) & 2) === 0, y = up ? size-1-vert : vert;
        if (!f[y][x] && idx < all.length*8) { m[y][x] = ((all[idx >>> 3] >>> (7 - (idx & 7))) & 1) === 1; idx++; }
      }
    }
    const maskFn = [(x,y)=>(x+y)%2===0,(x,y)=>y%2===0,(x,y)=>x%3===0,(x,y)=>(x+y)%3===0,(x,y)=>(Math.floor(x/3)+Math.floor(y/2))%2===0,(x,y)=>x*y%2+x*y%3===0,(x,y)=>(x*y%2+x*y%3)%2===0,(x,y)=>((x+y)%2+x*y%3)%2===0];
    const apply = mk => { for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) if (!f[y][x] && maskFn[mk](x, y)) m[y][x] = !m[y][x]; };
    const penalty = () => {
      let p = 0;
      for (let a = 0; a < 2; a++) for (let y = 0; y < size; y++) { let run = 1; for (let x = 1; x < size; x++) { const c = a ? m[x][y] : m[y][x], pc = a ? m[x-1][y] : m[y][x-1]; if (c === pc) { run++; if (run === 5) p += 3; else if (run > 5) p++; } else run = 1; } }
      for (let y = 0; y < size-1; y++) for (let x = 0; x < size-1; x++) { const c = m[y][x]; if (c === m[y][x+1] && c === m[y+1][x] && c === m[y+1][x+1]) p += 3; }
      let dark = 0; for (const r of m) for (const c of r) if (c) dark++;
      return p + Math.floor(Math.abs(dark*20 - size*size*10) / (size*size)) * 10;
    };
    let best = 0, bp = 1e9;
    for (let mk = 0; mk < 8; mk++) { apply(mk); fmt(mk); const p = penalty(); if (p < bp) { bp = p; best = mk; } apply(mk); }
    apply(best); fmt(best);
    return m;
  }
  function svg(text) {
    const m = encode(text), n = m.length, q = 4; let d = '';
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (m[y][x]) d += 'M'+(x+q)+','+(y+q)+'h1v1h-1z';
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+(n+2*q)+' '+(n+2*q)+'" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path d="'+d+'" fill="#111B54"/></svg>';
  }
  return { svg };
})();

/* ===================== Ilustraciones por categoría ===================== */
const ILL = {

  ambiente: '<svg viewBox="0 0 240 160"><circle cx="85" cy="80" r="56" fill="#1565D8"/><path d="M52 60c14-14 30-6 36 4s-6 18-18 16-26-6-18-20zM86 104c12-6 28 0 30 12s-14 16-26 10-12-16-4-22z" fill="#5BA326"/><ellipse cx="85" cy="80" rx="74" ry="14" fill="none" stroke="#111B54" stroke-width="3" transform="rotate(-20 85 80)"/><path d="M200 144c-38-6-56-44-50-84 38 0 62 38 50 84z" fill="#5BA326"/><path d="M200 144c-14-30-26-52-42-80" stroke="#236B28" stroke-width="4" fill="none" stroke-linecap="round"/></svg>',
  ciencia: '<svg viewBox="0 0 240 160"><g stroke="#111B54" stroke-width="5" stroke-linecap="round"><path d="M95 30v12M115 30v12M135 30v12M155 30v12M95 118v12M115 118v12M135 118v12M155 118v12M62 60h12M62 80h12M62 100h12M176 60h12M176 80h12M176 100h12"/></g><rect x="74" y="42" width="102" height="76" rx="10" fill="#111B54"/><rect x="92" y="56" width="66" height="48" rx="6" fill="#1565D8"/><text x="125" y="89" text-anchor="middle" font-family="Arial,sans-serif" font-weight="900" font-size="22" fill="#fff">CPU</text><g fill="#236B28"><circle cx="20" cy="148" r="6"/><circle cx="50" cy="148" r="6"/><circle cx="80" cy="148" r="6"/><circle cx="110" cy="148" r="6"/><circle cx="140" cy="148" r="6"/><circle cx="170" cy="148" r="6"/><circle cx="200" cy="148" r="6"/></g><path d="M20 148h180" stroke="#236B28" stroke-width="2"/></svg>'

/* ===================== Sonido (Web Audio API) ===================== */
let actx = null, soundOn = true;
function ac() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (actx && actx.state === 'suspended') actx.resume().catch(() => {});
  return actx;
}
function tone(f, d, type, v, delay) {
  if (!soundOn) return;
  const a = ac(); if (!a || a.state !== 'running') return;
  const t = a.currentTime + (delay || 0), o = a.createOscillator(), g = a.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v || 0.15, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d + 0.05);
}
function sounds(phase) {
  if (phase === 'GET_READY') { tone(523, .15, 'triangle'); tone(659, .15, 'triangle', .15, .15); tone(784, .35, 'triangle', .15, .3); }
  else if (phase === 'ANSWERING') { tone(440, .12, 'triangle'); tone(660, .18, 'triangle', .15, .12); }
  else if (phase === 'QUESTION_RESULT') { tone(262, .5, 'sine', .12); tone(330, .5, 'sine', .12); tone(392, .5, 'sine', .12); }
  else if (phase === 'LEADERBOARD') { tone(392, .12, 'triangle'); tone(523, .12, 'triangle', .15, .1); tone(659, .25, 'triangle', .15, .2); }
  else if (phase === 'PODIUM') { [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, .28, 'triangle', .18, i * .22)); }
}
function updateSndBtn() { $('#snd').textContent = soundOn ? '🔊 Sonido ON' : '🔇 Silencio'; }
$('#snd').addEventListener('click', () => { soundOn = !soundOn; updateSndBtn(); if (soundOn) { ac(); tone(660, .15, 'triangle'); } });
['pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, () => ac(), { once: true }));

/* ===================== Estado y render ===================== */
let S = null, offset = 0, cur = { key: '', pin: '' }, lastSec = -1;
const socket = io();
socket.on('connect', () => { socket.emit('watch'); $('#dot').classList.add('on'); });
socket.on('disconnect', () => { $('#dot').classList.remove('on'); });
socket.on('state', onState);

function onState(s) {
  S = s; offset = s.serverNow - Date.now();
  updateHeader();
  const key = s.phase + '|' + s.qNum;
  if (key !== cur.key) { cur.key = key; render(s); sounds(s.phase); }
  else live(s);
}
function updateHeader() {
  const s = S; let t;
  if (s.phase === 'LOBBY') t = s.online + ' conectados';
  else if (s.phase === 'PODIUM') t = 'Fin del juego · ' + s.online + ' conectados';
  else t = 'Pregunta ' + s.qNum + ' de ' + s.qTotal + ' · ' + s.online + ' conectados';
  $('#counter').textContent = t;
}
function live(s) {
  if (s.phase === 'LOBBY') { if (cur.pin !== s.pin) renderLobby(s); updatePlayers(); }
  else if (s.phase === 'ANSWERING') { const n = $('#na'); if (n) n.textContent = s.answered; }
}
function updatePlayers() {
  const box = $('#plist'); if (!box || !S) return;
  const ids = new Set(S.players.map(p => p.id));
  [...box.children].forEach(el => { if (!ids.has(el.dataset.id)) el.remove(); });
  S.players.forEach(p => {
    let el = box.querySelector('[data-id="' + p.id + '"]');
    if (!el) { el = document.createElement('div'); el.className = 'pcard'; el.dataset.id = p.id; box.appendChild(el); }
    el.textContent = p.name; el.classList.toggle('off', !p.online);
  });
  const c = $('#cnt'); if (c) c.textContent = S.online;
}
function renderLobby(s) {
  const base = location.origin;
  $('#stage').innerHTML =
    '<div class="lobby"><div class="joinbox card"><div class="qr" id="qr"></div><div class="steps">'
    + '<div class="step"><span class="n">1</span>Escanea el QR o entra a <b class="url">' + esc(base + '/jugar') + '</b></div>'
    + '<div class="step"><span class="n">2</span>Ingresa el PIN de juego:</div>'
    + '<div class="pin">' + esc(s.pin) + '</div>'
    + '<div class="wait">Esperando inicio del moderador… (<span id="cnt">' + s.online + '</span> participantes conectados)</div>'
    + '</div></div><div class="plist" id="plist"></div></div>';
  try { $('#qr').innerHTML = QR.svg(base + '/jugar?pin=' + s.pin); } catch (e) { $('#qr').textContent = 'QR no disponible'; }
  cur.pin = s.pin; updatePlayers();
}
function optsHtml(s, res) {
  return s.options.map((t, i) => {
    let cls = 'opt o' + i; if (res) cls += i === s.correct ? ' ok' : ' dim';
    return '<div class="' + cls + '"><span class="shape">' + SH[i] + '</span><span class="txt">' + esc(t) + '</span>' + (res && i === s.correct ? '<span class="check">✓</span>' : '') + '</div>';
  }).join('');
}
function render(s) {
  const st = $('#stage'); lastSec = -1;
  if (s.phase === 'LOBBY') return renderLobby(s);
  if (s.phase === 'GET_READY') {
    st.innerHTML = '<div class="center"><div class="badge">' + esc(s.category.label) + '</div><div class="qn">Pregunta ' + s.qNum + ' de ' + s.qTotal + '</div><div class="ready">¡Prepárate!</div></div>';
  } else if (s.phase === 'READING') {
    st.innerHTML = '<div class="center"><div class="badge">' + esc(s.category.label) + '</div><div class="rtext">' + esc(s.text) + '</div><div class="rtrack"><div class="rfill" id="rfill"></div></div></div>';
  } else if (s.phase === 'ANSWERING') {
    st.innerHTML = '<div class="qs"><div class="banner">' + esc(s.text) + '</div><div class="mid"><div class="timer" id="tm">' + s.timeTotal + '</div>'
      + '<div class="illus">' + (ILL[s.category.key] || '') + '<div class="cat">' + esc(s.category.label) + '</div></div>'
      + '<div class="ansbadge"><b id="na">' + s.answered + '</b><span>Respuestas</span></div></div><div class="opts">' + optsHtml(s, false) + '</div></div>';
  } else if (s.phase === 'QUESTION_RESULT') {
    const max = Math.max(1, ...s.counts);
    const cols = s.counts.map((n, i) => '<div class="col"><div class="num">' + n + '</div><div class="barwrap"><div class="bar o' + i + '" data-h="' + Math.round(n / max * 100) + '"></div></div><div class="cshape o' + i + '">' + SH[i] + '</div></div>').join('');
    st.innerHTML = '<div class="qs"><div class="banner">' + esc(s.text) + '</div><div class="mid res"><div class="chartcard">' + cols + '</div></div><div class="opts">' + optsHtml(s, true) + '</div></div>';
    requestAnimationFrame(() => requestAnimationFrame(() => document.querySelectorAll('.bar').forEach(b => { b.style.height = Math.max(+b.dataset.h, 3) + '%'; })));
  } else if (s.phase === 'LEADERBOARD') {
    st.innerHTML = '<div class="lb"><h2>🏆 Ranking · Top 5</h2>' + s.top5.map((p, i) =>
      '<div class="lrow' + (i === 0 ? ' first' : '') + '" style="animation-delay:' + (i * 0.12) + 's"><div class="rk">' + p.rank + '.º</div><div class="nm">' + esc(p.name) + '</div>'
      + (p.streak >= 2 ? '<div class="st">🔥 Racha ' + p.streak + '</div>' : '<div></div>') + '<div class="sc">' + p.score + '</div></div>').join('') + '</div>';
  } else if (s.phase === 'PODIUM') {
    const P = s.podium, col = (i, cls, medal) => P[i]
      ? '<div class="pcol ' + cls + '"><div class="pname">' + esc(P[i].name) + '</div><div class="pblock"><div class="medal">' + medal + '</div><div>' + (i + 1) + '.º</div><div class="pts">' + P[i].score + ' pts</div></div></div>' : '';
    st.innerHTML = '<div class="podh">🎉 ¡Podio final!</div><div class="pod">' + col(1, 'p2', '🥈') + col(0, 'p1', '🥇') + col(2, 'p3', '🥉') + '</div>';
  }
}

/* ===================== Temporizador visual ===================== */
setInterval(() => {
  if (!S) return;
  const rem = Math.max(0, S.phaseEndsAt - (Date.now() + offset));
  if (S.phase === 'ANSWERING') {
    const sec = Math.ceil(rem / 1000), tm = $('#tm');
    if (tm) { tm.textContent = sec; tm.classList.toggle('low', sec <= 5); }
    if (sec !== lastSec) { lastSec = sec; if (sec > 0 && sec <= 5) tone(900, .07, 'square', .06); }
  } else if (S.phase === 'READING') {
    const f = $('#rfill'); if (f && S.phaseMs) f.style.width = (rem / S.phaseMs * 100) + '%';
  }
}, 100);

// Keep-alive para el plan gratuito de Render (cada 4 minutos)
setInterval(() => fetch('/ping').catch(() => {}), 240000);
</script>
