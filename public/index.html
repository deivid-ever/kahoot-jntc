<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JNTC Quiz · Proyector</title>
<style>
:root{--bg:#F4F7FB;--wm:#E8EEF7;--surface:#FFFFFF;--line:#DCE4F0;--navy:#111B54;--royal:#1565D8;--green:#236B28;--leaf:#5BA326;--red:#DC2626;--gold:#F5B700;--shadow:0 6px 20px rgba(17,27,84,.06)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--navy);overflow:hidden;display:flex;flex-direction:column}
.wm{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.top{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:8px 24px;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:12px}
.logo-h{height:68px;width:auto;display:block}
.sep{width:2px;height:44px;background:var(--line);border-radius:2px}
.logo-e{height:64px;width:64px;display:block}
.right{display:flex;align-items:center;gap:12px;font-weight:700}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:.95rem}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--red);margin-right:6px}
.dot.on{background:var(--leaf)}
button.snd{cursor:pointer;font:inherit;font-weight:700;font-size:.9rem;color:var(--navy);background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 14px}
button.snd:hover{background:var(--bg)}
#stage{position:relative;z-index:1;flex:1;min-height:0;padding:2vh 3vw;display:flex;flex-direction:column}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}

/* Lobby */
.lobby{--qr:min(calc(100vh - 198px),50vw);flex:1;min-height:0;display:grid;grid-template-columns:auto 1fr;gap:2.2vw;align-items:stretch}
.qrcard{background:#fff;border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);padding:1.6vh 1.6vh 1.2vh;display:flex;flex-direction:column;align-items:center;gap:1vh;animation:fadeUp .7s both}
.qr{width:var(--qr);height:var(--qr);border-radius:14px;overflow:hidden;background:#fff}
.qr svg{width:100%;height:100%;display:block}
.qrcap{font-weight:800;font-size:clamp(1rem,1.7vw,1.7rem);color:var(--navy);display:flex;align-items:center;gap:.6em}
.qrcap i{display:inline-block;width:.7em;height:.7em;border-radius:50%;background:var(--leaf);animation:blink 1.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
@keyframes fadeUp{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.lside{min-width:0;min-height:0;display:flex;flex-direction:column;gap:1.8vh}
.lhead{display:flex;align-items:center;gap:1.8vw;padding:1.8vh 1.8vw;animation:fadeUp .7s .1s both}
.lhead .ev{height:15vh;width:15vh;flex:none}
.lhead .lt{min-width:0}
.lhead .k{font-weight:800;font-size:clamp(1.2rem,2.5vw,2.6rem);line-height:1.1;color:var(--navy)}
.lhead .u{margin-top:.6vh;font-weight:700;font-size:clamp(.95rem,1.55vw,1.5rem);color:var(--royal);word-break:break-all}
.lhead .u span{color:#55608a;font-weight:600}
.pinbox{background:linear-gradient(135deg,var(--navy),#1B2A7A);color:#fff;border-radius:22px;padding:1.6vh 2vw 2vh;text-align:center;box-shadow:var(--shadow);animation:fadeUp .7s .2s both}
.pinbox span{display:block;font-weight:800;letter-spacing:.2em;font-size:clamp(.8rem,1.2vw,1.2rem);opacity:.8}
.pin{font-weight:900;letter-spacing:.16em;padding-left:.16em;font-size:clamp(2.6rem,6vw,6.6rem);line-height:1.1;font-variant-numeric:tabular-nums}
.wait{display:flex;align-items:center;gap:.7em;font-size:clamp(.95rem,1.5vw,1.45rem);font-weight:800;color:var(--green);animation:fadeUp .7s .3s both}
.wait i{flex:none;width:.8em;height:.8em;border-radius:50%;background:var(--leaf);animation:blink 1.4s ease-in-out infinite}
.wait b{background:var(--green);color:#fff;border-radius:999px;padding:.05em .7em}
.pwrap{flex:1;min-height:0;display:flex;flex-direction:column;background:rgba(255,255,255,.7);border:1px solid var(--line);border-radius:22px;padding:1.4vh 1.4vw;animation:fadeUp .7s .4s both}
.pwrap h3{font-size:clamp(.85rem,1.2vw,1.2rem);font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#55608a;margin-bottom:1vh}
.plist{flex:1;min-height:0;overflow:hidden;display:flex;flex-wrap:wrap;align-content:flex-start;gap:.9vh .7vw}
.pcard{background:#fff;border:1px solid var(--line);border-bottom:4px solid var(--royal);border-radius:12px;padding:.6vh 1vw;font-weight:800;font-size:clamp(.9rem,1.4vw,1.35rem);box-shadow:var(--shadow);animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
.pcard.off{opacity:.45}
.pempty{color:#8893b5;font-weight:700;font-size:clamp(.9rem,1.3vw,1.25rem)}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}

/* Prepárate / lectura */
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vh;text-align:center}
.badge{background:var(--green);color:#fff;font-weight:800;border-radius:999px;padding:.5em 1.4em;font-size:clamp(1rem,2vw,1.8rem)}
.qn{font-size:clamp(1.4rem,3vw,2.8rem);font-weight:700}
.ready{font-size:clamp(3rem,9vw,8rem);font-weight:900;color:var(--royal);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.rtext{max-width:85vw;font-size:clamp(1.8rem,4.6vw,4.6rem);font-weight:800;line-height:1.2}
.rtrack{width:70vw;height:14px;background:var(--line);border-radius:99px;overflow:hidden}
.rfill{height:100%;width:100%;background:var(--royal);border-radius:99px;transition:width .12s linear}

/* Pregunta */
.qs{flex:1;min-height:0;display:grid;grid-template-rows:auto 1fr auto;gap:2vh}
.banner{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:2vh 2vw;text-align:center;font-weight:800;font-size:clamp(1.2rem,2.7vw,2.6rem);line-height:1.2;color:var(--navy)}
.mid{display:grid;grid-template-columns:150px 1fr 200px;gap:2vw;align-items:center;min-height:0}
.mid.res{grid-template-columns:1fr}
.timer{width:88px;height:88px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:2.4rem;font-weight:800;justify-self:center}
.timer.low{background:var(--red)}
.illus{height:100%;min-height:0;background:#fff;border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1vh;box-shadow:var(--shadow)}
.illus svg{flex:1;min-height:0;width:auto;max-width:100%}
.illus .cat{font-weight:800;color:var(--green);font-size:clamp(.9rem,1.5vw,1.4rem)}
.ansbadge{justify-self:center;text-align:center;background:var(--navy);color:#fff;border-radius:18px;padding:1.4vh 1.6vw;display:flex;flex-direction:column;align-items:center}
.ansbadge b{font-size:clamp(2rem,4vw,3.6rem);line-height:1}
.ansbadge span{font-weight:700}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:1.6vh 1.6vw;height:32vh}
.opt{display:flex;align-items:center;gap:1.2vw;padding:0 1.6vw;border-radius:14px;color:#fff;font-weight:800;border-bottom:6px solid rgba(0,0,0,.22);font-size:clamp(1rem,2.1vw,2rem);min-height:0;line-height:1.15;transition:opacity .4s,transform .4s}
.opt .shape{font-size:clamp(1.6rem,3.4vw,3.4rem);width:1.3em;text-align:center;flex:none}
.opt .check{margin-left:auto;font-size:clamp(1.8rem,3.4vw,3.2rem);flex:none}
.o0{background:var(--royal)}.o1{background:var(--green)}.o2{background:var(--navy)}.o3{background:var(--leaf)}
.opt.dim{opacity:.32}
.opt.ok{transform:scale(1.02);box-shadow:0 0 0 4px #fff,0 0 0 9px var(--gold),0 0 28px 8px rgba(245,183,0,.55)}
.chartcard{height:100%;min-height:0;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);display:flex;align-items:stretch;justify-content:center;gap:4vw;padding:1.6vh 2vw}
.col{flex:0 0 13vw;display:flex;flex-direction:column;align-items:center;min-height:0}
.num{font-size:clamp(1.4rem,3vw,2.8rem);font-weight:900;line-height:1.1}
.barwrap{flex:1;min-height:0;width:100%;display:flex;align-items:flex-end}
.bar{width:100%;height:0;min-height:6px;border-radius:10px 10px 0 0;transition:height .9s cubic-bezier(.2,.9,.3,1)}
.cshape{width:100%;text-align:center;color:#fff;font-weight:800;font-size:clamp(1.2rem,2.4vw,2.2rem);padding:.2em 0;border-radius:0 0 10px 10px}

/* Ranking */
.lb{width:100%;max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:1.6vh;flex:1;justify-content:center}
.lb h2{text-align:center;font-size:clamp(1.6rem,3.4vw,3rem);font-weight:900}
.lrow{display:grid;grid-template-columns:clamp(50px,6vw,80px) 1fr auto auto;align-items:center;gap:1.4vw;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:1.5vh 1.6vw;font-weight:800;font-size:clamp(1.1rem,2.4vw,2.2rem);animation:slide .5s both}
.lrow.first{background:var(--navy);color:#fff;border-color:var(--navy)}
.lrow .rk{font-size:1.2em;text-align:center}
.lrow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .st{font-size:.65em;background:#FFF1D6;color:#B45309;border-radius:999px;padding:.15em .7em}
.lrow.first .st{background:rgba(255,255,255,.18);color:#fff}
@keyframes slide{from{transform:translateX(-40px);opacity:0}to{transform:none;opacity:1}}

/* Podio */
.pv{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;margin:0 -3vw -2vh;overflow:hidden}
.ptitle{align-self:center;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:1.2vh 3vw;font-weight:900;font-size:clamp(1.6rem,3.6vw,3.4rem);letter-spacing:-.01em;animation:drop .9s cubic-bezier(.2,1.3,.4,1) both}
@keyframes drop{from{transform:translateY(-140%) scale(.9);opacity:0}to{transform:none;opacity:1}}
.pstage{flex:1;min-height:0;display:flex;align-items:flex-end;justify-content:center;padding-top:3vh}
.pcol{position:relative;width:24vw;max-width:440px;display:flex;flex-direction:column;align-items:stretch;animation:up 1.15s cubic-bezier(.16,1,.3,1) both}
@keyframes up{from{transform:translateY(105vh)}to{transform:none}}
.pname{align-self:flex-start;margin:0 0 1.2vh 6%;max-width:100%;font-weight:900;font-size:clamp(1.3rem,2.9vw,2.8rem);line-height:1.05;color:var(--navy);transform:rotate(-4deg);transform-origin:left bottom;word-break:break-word;animation:nameIn .7s cubic-bezier(.2,1.5,.4,1) both}
@keyframes nameIn{from{transform:rotate(-4deg) scale(.2);opacity:0}to{transform:rotate(-4deg) scale(1);opacity:1}}
.pblock{position:relative;border-radius:18px 18px 0 0;color:#fff;display:flex;flex-direction:column;align-items:center;padding-top:1.8vh;box-shadow:0 -6px 28px rgba(17,27,84,.16)}
.pblock::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,0) 40%);pointer-events:none}
.p1{z-index:3}.p2{z-index:2}.p3{z-index:2}
.p1 .pblock{height:62vh;background:linear-gradient(180deg,#2B7AF0,var(--royal) 45%,var(--navy))}
.p2 .pblock{height:50vh;background:linear-gradient(180deg,#2F8F36,var(--green))}
.p3 .pblock{height:41vh;background:linear-gradient(180deg,#76BE3C,var(--leaf))}
.ribbon{position:absolute;top:0;left:50%;width:13vh;height:6vh;transform:translateX(-50%);z-index:1}
.ribbon i{position:absolute;top:0;width:54%;height:100%;background:rgba(255,255,255,.92)}
.ribbon i:first-child{left:6%;clip-path:polygon(0 0,70% 0,100% 100%,30% 100%);background:rgba(255,255,255,.95)}
.ribbon i:last-child{right:6%;clip-path:polygon(30% 0,100% 0,70% 100%,0 100%);background:rgba(255,255,255,.6)}
.medal{position:relative;z-index:2;width:11vh;height:11vh;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:6vh;line-height:1;color:#fff;text-shadow:0 .4vh 0 rgba(0,0,0,.18);margin-top:1.6vh;transform-origin:50% -3vh;animation:medalIn .9s cubic-bezier(.2,1.6,.4,1) both,swing 3.4s ease-in-out infinite}
.medal::after{content:"";position:absolute;top:8%;left:16%;width:34%;height:20%;border-radius:50%;background:rgba(255,255,255,.4);transform:rotate(-30deg)}
.m1{background:radial-gradient(circle at 35% 30%,#FFE27A,#F5B700 60%,#D99A00);border:.7vh solid #E0A200}
.m2{background:radial-gradient(circle at 35% 30%,#F4F6FA,#C5CDD9 60%,#A5AFBF);border:.7vh solid #9AA5B5}
.m3{background:radial-gradient(circle at 35% 30%,#F5BE78,#DB8E3A 60%,#BC6A22);border:.7vh solid #B2641B}
@keyframes medalIn{from{transform:scale(0) rotate(-200deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
@keyframes swing{0%,100%{transform:rotate(-3.5deg)}50%{transform:rotate(3.5deg)}}
.pscore{margin-top:1.6vh;font-weight:900;font-size:clamp(1.6rem,3.4vw,3.3rem);line-height:1;font-variant-numeric:tabular-nums}
.pcor{margin-top:.6vh;font-weight:800;font-size:clamp(.9rem,1.6vw,1.5rem);opacity:.95}
.runners{position:absolute;left:50%;bottom:2vh;transform:translateX(-50%);z-index:5;width:min(42vw,720px);background:var(--navy);color:#fff;border-radius:18px 18px 0 0;padding:1.3vh 1.4vw 1.4vh;box-shadow:0 -8px 30px rgba(17,27,84,.3);animation:slideUp .9s cubic-bezier(.2,1.2,.4,1) both}
@keyframes slideUp{from{transform:translate(-50%,120%)}to{transform:translate(-50%,0)}}
.runners h3{text-align:center;font-size:clamp(.95rem,1.6vw,1.5rem);font-weight:800;margin-bottom:1vh}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:1.2vw}
.rcard{display:flex;align-items:center;gap:.8vw;background:rgba(255,255,255,.12);border-radius:12px;padding:.8vh .8vw;min-width:0;font-weight:800;font-size:clamp(.9rem,1.5vw,1.4rem)}
.rcard .rn{flex:none;width:2.1em;height:2.1em;border-radius:50%;border:.28em solid rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;font-weight:900;line-height:1}
.rcard .rt{min-width:0;display:flex;flex-direction:column}
.rcard .rt b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rcard .rt small{font-size:.7em;opacity:.8;font-weight:700}
#confetti{position:fixed;inset:0;width:100%;height:100%;z-index:4;pointer-events:none}
@media (prefers-reduced-motion:reduce){.medal{animation:medalIn .01s both}}

/* ===================== ANIMACIONES MEJORADAS (PROYECTOR) ===================== */
.wm g:first-child circle:nth-child(1),
.wm g:first-child circle:nth-child(2) {
  transform-origin: 1060px 110px;
  animation: gearSpin 45s linear infinite;
}
.wm g:first-child circle:nth-child(3),
.wm g:first-child circle:nth-child(4) {
  transform-origin: 110px 610px;
  animation: gearSpinRev 60s linear infinite;
}
.wm g:last-child rect {
  transform-box: fill-box;
  transform-origin: bottom center;
  animation: barBreath 6s ease-in-out infinite alternate;
}
.wm g:last-child rect:nth-child(2) { animation-delay: -2s; }
.wm g:last-child rect:nth-child(3) { animation-delay: -4s; }

@keyframes gearSpin { to { transform: rotate(360deg); } }
@keyframes gearSpinRev { to { transform: rotate(-360deg); } }
@keyframes barBreath {
  from { transform: scaleY(0.92); opacity: 0.75; }
  to   { transform: scaleY(1.06); opacity: 1; }
}

/* Lobby: brillo en PIN y entrada elástica de jugadores */
.pinbox {
  position: relative;
  overflow: hidden;
}
.pinbox::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,.16) 50%, transparent 70%);
  transform: translateX(-100%);
  animation: sheen 4.5s ease-in-out infinite;
  pointer-events: none;
}
@keyframes sheen {
  0%, 60% { transform: translateX(-120%); }
  100%    { transform: translateX(120%); }
}
.pcard {
  animation: popSpring .55s cubic-bezier(.34, 1.56, .64, 1) both;
  transition: opacity .3s ease, transform .3s ease;
}
@keyframes popSpring {
  0%   { transform: scale(.3) translateY(14px); opacity: 0; }
  100% { transform: scale(1) translateY(0); opacity: 1; }
}

/* Prepárate y Lectura */
.center .badge { animation: popSpring .5s cubic-bezier(.34,1.56,.64,1) both; }
.center .qn    { animation: fadeUp .5s .12s both; }
.center .ready { animation: readyIn .65s .2s cubic-bezier(.34,1.56,.64,1) both, pulse 1s .85s ease-in-out infinite; }
.center .rtext { animation: fadeUp .6s .1s cubic-bezier(.22,1,.36,1) both; }
.center .rtrack { animation: fadeUp .5s .25s both; }
.rfill {
  background: linear-gradient(90deg, var(--royal), #3B82F6);
  box-shadow: 0 0 12px rgba(21,101,216,.45);
}
@keyframes readyIn {
  from { transform: scale(.4); opacity: 0; }
  to   { transform: scale(1); opacity: 1; }
}

/* Pantalla de Pregunta (ANSWERING) */
.banner { animation: slideDown .5s cubic-bezier(.22,1,.36,1) both; }
@keyframes slideDown {
  from { transform: translateY(-28px); opacity: 0; }
  to   { transform: none; opacity: 1; }
}
.illus {
  animation: popSpring .6s .1s both;
}
.illus svg {
  animation: floatSlow 4s ease-in-out infinite;
}
@keyframes floatSlow {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-7px); }
}

/* Imagen acorde a la pregunta dentro de .illus */
.illus.has-img {
  position: relative;
  padding: 0;
  overflow: hidden;
  background: #0d1438;
}
.illus.has-img svg {
  display: none;
}
.illus .qimg {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  animation: kenBurns 18s ease-out both, imgFadeIn .55s ease both;
}
.illus.has-img .cat {
  position: absolute;
  bottom: 10px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(17, 27, 84, .82);
  color: #fff;
  backdrop-filter: blur(6px);
  padding: 4px 16px;
  border-radius: 999px;
  white-space: nowrap;
  box-shadow: 0 4px 12px rgba(0,0,0,.25);
}
@keyframes kenBurns {
  from { transform: scale(1); }
  to   { transform: scale(1.08); }
}
@keyframes imgFadeIn {
  from { opacity: 0; }
  to   { opacity: 1; }
}

/* Temporizador con urgencia real */
.timer {
  transition: background .25s ease, transform .2s ease;
  box-shadow: 0 8px 20px rgba(17,27,84,.2);
}
.timer.low {
  animation: urgentPulse .55s ease-in-out infinite;
  box-shadow: 0 0 0 0 rgba(220,38,38,.6);
}
@keyframes urgentPulse {
  0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(220,38,38,.55); }
  50%      { transform: scale(1.12); box-shadow: 0 0 0 16px rgba(220,38,38,0); }
}

/* Pop cuando entra una nueva respuesta */
.ansbadge b.bump {
  animation: numBump .3s cubic-bezier(.34, 1.56, .64, 1);
}
@keyframes numBump {
  0%   { transform: scale(1); }
  40%  { transform: scale(1.38); }
  100% { transform: scale(1); }
}

/* Entrada escalonada de las 4 opciones */
.opts .opt {
  animation: optIn .48s cubic-bezier(.22, 1.25, .36, 1) both;
  transition: opacity .45s ease, transform .45s cubic-bezier(.22,1.25,.36,1), filter .45s ease;
}
.opts .opt:nth-child(1) { animation-delay: .05s; }
.opts .opt:nth-child(2) { animation-delay: .12s; }
.opts .opt:nth-child(3) { animation-delay: .19s; }
.opts .opt:nth-child(4) { animation-delay: .26s; }
@keyframes optIn {
  from { transform: translateY(28px) scale(.94); opacity: 0; }
  to   { transform: none; opacity: 1; }
}

/* Resultados (QUESTION_RESULT) */
.opt.dim {
  opacity: .32;
  transform: scale(.97);
  filter: saturate(.5);
}
.opt.ok {
  animation: okCelebrate .65s cubic-bezier(.34,1.56,.64,1) both, okGlow 1.8s .65s ease-in-out infinite;
  z-index: 2;
}
.opt.ok .check {
  animation: popSpring .5s .2s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes okCelebrate {
  0%   { transform: scale(.98); }
  50%  { transform: scale(1.04); }

.curtain-panel {
  position: absolute;
  top: -5%;
  bottom: -5%;

  z-index: 4;
  background:
    repeating-linear-gradient(
      90deg,
      #7a0404 0px,
      #c2051f 16px,
      #5c0101 32px,

      #4a0000 64px

  content: "";
  position: absolute;
  top: 0; left: -2px; right: -2px;
  height: 7%;

    repeating-radial-gradient(circle at 50% 0%, #FFD24C 0 7px, #c98f00 7px 8px, transparent 8px 38px);

.curtain-panel.left {

  animation: openLeft 1.05s .15s cubic-bezier(.34, 1.56, .64, 1) forwards;
}
.curtain-panel.right {
  right: 0;

  transform-origin: right center;
  animation: openRight 1.05s .15s cubic-bezier(.34, 1.56, .64, 1) forwards;
}

['pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, () => ac(), { once: true }));

/* ===================== Estado y render ===================== */
let S = null, offset = 0, cur = { key: '', pin: '' }, lastSec = -1;
const socket = io();
socket.on('connect', () => { socket.emit('watch'); $('#dot').classList.add('on'); });
socket.on('disconnect', () => { $('#dot').classList.remove('on'); });
socket.on('state', onState);

function onState(s) {
  S = s; offset = s.serverNow - Date.now();
  updateHeader();
  const key = s.phase + '|' + s.qNum;
  if (key !== cur.key) { cur.key = key; render(s); sounds(s.phase); }
  else live(s);
}
function updateHeader() {
  const s = S; let t;
  if (s.phase === 'LOBBY') t = s.online + ' conectados';
  else if (s.phase === 'PODIUM') t = 'Fin del juego · ' + s.online + ' conectados';
  else t = 'Pregunta ' + s.qNum + ' de ' + s.qTotal + ' · ' + s.online + ' conectados';
  $('#counter').textContent = t;
}
let lastCurtainQ = -1;
function playCurtain(qNum, qText, catLabel) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  if (lastCurtainQ === qNum) return;
  lastCurtainQ = qNum;
  const prev = document.getElementById('curtainStage');
  if (prev) prev.remove();
  const stage = document.createElement('div');
  stage.id = 'curtainStage';
  stage.innerHTML =
    '<div class="curtain-panel left"></div>'
    + '<div class="curtain-panel right"></div>'
    + '<div class="spotlight-beam"><span class="spot-cone"></span><span class="spot-pool"></span></div>'
    + '<div class="stage-q">'
    + '<div class="sq-tag">Pregunta ' + qNum + (catLabel ? ' · ' + esc(catLabel) : '') + '</div>'
    + '<div class="sq-text">' + esc(qText || '¡Prepárate!') + '</div>'
    + '</div>';
  document.body.appendChild(stage);
  setTimeout(() => { if (stage.isConnected) stage.remove(); }, 1900);
}

function live(s) {
  if (s.phase === 'LOBBY') { if (cur.pin !== s.pin) renderLobby(s); updatePlayers(); }
  else if (s.phase === 'ANSWERING') {
    const n = $('#na');
    if (n && n.textContent !== String(s.answered)) {
      n.textContent = s.answered;
      n.classList.remove('bump');
      void n.offsetWidth;
      n.classList.add('bump');
    }
  }
}
function updatePlayers() {
  const box = $('#plist'); if (!box || !S) return;
  const ids = new Set(S.players.map(p => p.id));
  [...box.children].forEach(el => { if (!ids.has(el.dataset.id)) el.remove(); });
  S.players.forEach(p => {
    let el = box.querySelector('[data-id="' + p.id + '"]');
    if (!el) { el = document.createElement('div'); el.className = 'pcard'; el.dataset.id = p.id; box.appendChild(el); }
    el.textContent = p.name; el.classList.toggle('off', !p.online);
  });
  if (!S.players.length && !box.querySelector('.pempty')) box.innerHTML = '<div class="pempty">Aquí aparecerán los participantes…</div>';
  else if (S.players.length) { const pe = box.querySelector('.pempty'); if (pe) pe.remove(); }
  const c = $('#cnt'); if (c) c.textContent = S.online;
}
function renderLobby(s) {
  const base = location.origin;
  $('#stage').innerHTML =
    '<div class="lobby"><div class="qrcard"><div class="qr" id="qr"></div><div class="qrcap"><i></i>Escanea con la cámara de tu celular</div></div>'
    + '<div class="lside"><div class="lhead card"><img class="ev" src="/logo-evento.svg" alt=""><div class="lt"><div class="k">¡Únete al juego!</div>'
    + '<div class="u"><span>o entra a</span> ' + esc(base.replace(/^https?:\/\//, '') + '/jugar') + '</div></div></div>'
    + '<div class="pinbox"><span>PIN DE JUEGO</span><div class="pin">' + esc(s.pin) + '</div></div>'
    + (s.round ? '<div class="wait" style="background:#FFF4D6;color:#8a5b00"><i></i><b>' + esc(s.round.label) + '</b></div>' : '')
    + '<div class="wait"><i></i>Esperando inicio del moderador… <b id="cnt">' + s.online + '</b> conectados</div>'
    + '<div class="pwrap"><h3>Participantes</h3><div class="plist" id="plist"></div></div></div></div>';
  try { $('#qr').innerHTML = QR.svg(base + '/jugar?pin=' + s.pin); } catch (e) { $('#qr').textContent = 'QR no disponible'; }
  cur.pin = s.pin; updatePlayers();
}
function optsHtml(s, res) {
  return s.options.map((t, i) => {
    let cls = 'opt o' + i; if (res) cls += i === s.correct ? ' ok' : ' dim';
    return '<div class="' + cls + '"><span class="shape">' + SH[i] + '</span><span class="txt">' + esc(t) + '</span>' + (res && i === s.correct ? '<span class="check">✓</span>' : '') + '</div>';
  }).join('');
}
function render(s) {
  const st = $('#stage'); lastSec = -1;
  if (s.phase !== 'PODIUM') stopConfetti();
  if (s.phase === 'LOBBY') { lastCurtainQ = -1; const c = document.getElementById('curtainStage'); if (c) c.remove(); return renderLobby(s); }
  if (s.phase === 'GET_READY') {
    st.innerHTML = '<div class="center"><div class="badge">' + esc(s.category.label) + '</div><div class="qn">Pregunta ' + s.qNum + ' de ' + s.qTotal + '</div><div class="ready">¡Prepárate!</div></div>';
  } else if (s.phase === 'READING') {
    playCurtain(s.qNum, s.text, s.category ? s.category.label : '');
    st.innerHTML = '<div class="center"><div class="badge">' + esc(s.category.label) + '</div><div class="rtext">' + esc(s.text) + '</div><div class="rtrack"><div class="rfill" id="rfill"></div></div></div>';
  } else if (s.phase === 'ANSWERING') {
    const hasImg = !!s.img;
    const imgHtml = hasImg
      ? '<img class="qimg" src="' + esc(s.img) + '" alt="" onerror="this.remove();this.parentNode.classList.remove(\'has-img\')">'
      : '';
    st.innerHTML = '<div class="qs"><div class="banner">' + esc(s.text) + '</div><div class="mid"><div class="timer" id="tm">' + s.timeTotal + '</div>'
      + '<div class="illus' + (hasImg ? ' has-img' : '') + '">' + imgHtml + (ILL[s.category.key] || '') + '<div class="cat">' + esc(s.category.label) + '</div></div>'
      + '<div class="ansbadge"><b id="na">' + s.answered + '</b><span>Respuestas</span></div></div><div class="opts">' + optsHtml(s, false) + '</div></div>';
  } else if (s.phase === 'QUESTION_RESULT') {
    const max = Math.max(1, ...s.counts);
    const cols = s.counts.map((n, i) => '<div class="col"><div class="num">' + n + '</div><div class="barwrap"><div class="bar o' + i + '" data-h="' + Math.round(n / max * 100) + '"></div></div><div class="cshape o' + i + '">' + SH[i] + '</div></div>').join('');
    st.innerHTML = '<div class="qs"><div class="banner">' + esc(s.text) + '</div><div class="mid res"><div class="chartcard">' + cols + '</div></div><div class="opts">' + optsHtml(s, true) + '</div></div>';
    requestAnimationFrame(() => requestAnimationFrame(() => document.querySelectorAll('.bar').forEach(b => { b.style.height = Math.max(+b.dataset.h, 3) + '%'; })));
  } else if (s.phase === 'LEADERBOARD') {
    st.innerHTML = '<div class="lb"><h2>🏆 Ranking · Top 5</h2>' + s.top5.map((p, i) =>
      '<div class="lrow' + (i === 0 ? ' first' : '') + '" style="animation-delay:' + (i * 0.12) + 's"><div class="rk">' + p.rank + '.º</div><div class="nm">' + esc(p.name) + '</div>'
      + (p.streak >= 2 ? '<div class="st">🔥 Racha ' + p.streak + '</div>' : '<div></div>') + '<div class="sc">' + p.score + '</div></div>').join('') + '</div>';
  } else if (s.phase === 'PODIUM') {
    renderPodium(s);
  }
}

/* ===================== Podio ===================== */
function podCol(p, cls, delay, total) {
  if (!p) return '<div class="pcol ' + cls + '" style="visibility:hidden"><div class="pname">&nbsp;</div><div class="pblock"></div></div>';
  const d = delay / 1000;
  return '<div class="pcol ' + cls + '" style="animation-delay:' + d + 's">'
    + '<div class="pname" style="animation-delay:' + (d + 0.75) + 's">' + esc(p.name) + '</div>'
    + '<div class="pblock"><div class="ribbon"><i></i><i></i></div>'
    + '<div class="medal m' + p.rank + '" style="animation-delay:' + (d + 0.55) + 's,' + (d + 1.5) + 's">' + p.rank + '</div>'
    + '<div class="pscore cu" data-v="' + p.score + '" data-d="' + (delay + 700) + '">0</div>'
    + '<div class="pcor">' + p.correct + ' de ' + total + ' correctas</div></div></div>';
}
function renderPodium(s) {
  const P = s.podium, R = s.runners || [], total = s.qTotal;
  const runners = R.length ? '<div class="runners" style="animation-delay:3.2s"><h3>Finalistas</h3><div class="rgrid">'
    + R.map(p => '<div class="rcard"><span class="rn">' + p.rank + '</span><span class="rt"><b>' + esc(p.name) + '</b><small>' + p.score + ' pts · ' + (p.correct || 0) + ' de ' + total + '</small></span></div>').join('') + '</div></div>' : '';
  $('#stage').innerHTML = '<div class="pv"><div class="ptitle">¡Conozcan a los ganadores!</div><div class="pstage">'
    + podCol(P[1], 'p2', 1200, total) + podCol(P[0], 'p1', 2200, total) + podCol(P[2], 'p3', 300, total)
    + '</div>' + runners + '</div>';
  document.querySelectorAll('.cu').forEach(el => countUp(el, +el.dataset.v, +el.dataset.d));
  startConfetti(2300);
}
function countUp(el, to, delay) {
  const t0 = performance.now() + delay, dur = 1700;
  (function f(now) {
    if (!el.isConnected) return;
    const k = Math.min(1, Math.max(0, (now - t0) / dur)), e = 1 - Math.pow(1 - k, 3);
    el.textContent = Math.round(to * e);
    if (k < 1) requestAnimationFrame(f);
  })(performance.now());
}

/* ===================== Confeti ===================== */
const cv = $('#confetti'), cx = cv.getContext('2d');
let parts = [], cfRun = false, cfStart = 0, cfBurst = 0, cfBurstDone = false;
const CF_COL = ['#1565D8', '#236B28', '#5BA326', '#F5B700', '#DC2626', '#111B54', '#6FA8F0'];
function cfSize() { const r = Math.min(2, window.devicePixelRatio || 1); cv.width = innerWidth * r; cv.height = innerHeight * r; cx.setTransform(r, 0, 0, r, 0, 0); }
addEventListener('resize', cfSize); cfSize();
function spawn(x, y, burst) {
  parts.push({ x, y, vx: burst ? (Math.random() - .5) * 14 : (Math.random() - .5) * 1.6, vy: burst ? -6 - Math.random() * 10 : 1.4 + Math.random() * 2.4,
    rot: Math.random() * 6.28, vr: (Math.random() - .5) * .3, w: 6 + Math.random() * 8, h: 4 + Math.random() * 8,
    c: CF_COL[(Math.random() * CF_COL.length) | 0], sh: (Math.random() * 3) | 0, ph: Math.random() * 6.28 });
}
function startConfetti(burstAt) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  parts = []; cfRun = true; cfStart = performance.now(); cfBurst = burstAt; cfBurstDone = false;
  requestAnimationFrame(cfLoop);
}
function stopConfetti() { cfRun = false; parts = []; cx.clearRect(0, 0, innerWidth, innerHeight); }
function cfLoop(now) {
  if (!cfRun) return;
  const el = now - cfStart, W = innerWidth, H = innerHeight;
  cx.clearRect(0, 0, W, H);
  if (parts.length < 220) { const n = el < 6000 ? 3 : 1; for (let i = 0; i < n; i++) spawn(Math.random() * W, -20, false); }
  if (!cfBurstDone && el > cfBurst) { cfBurstDone = true; for (let i = 0; i < 90; i++) spawn(W * .5 + (Math.random() - .5) * W * .1, H * .45, true); }
  parts = parts.filter(p => p.y < H + 30);
  for (const p of parts) {
    p.vy += p.vx !== 0 && p.vy < 0 ? .28 : .02; p.vx *= .985; if (p.vy > 4.2) p.vy = 4.2;
    p.ph += .05; p.x += p.vx + Math.sin(p.ph) * .6; p.y += p.vy; p.rot += p.vr;
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.rot); cx.fillStyle = p.c;
    if (p.sh === 0) cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
    else if (p.sh === 1) { cx.beginPath(); cx.ellipse(0, 0, p.w / 2, p.h / 2, 0, 0, 6.28); cx.fill(); }
    else { cx.fillRect(-p.w / 2, -1.5, p.w, 3); }
    cx.restore();
  }
  requestAnimationFrame(cfLoop);
}

/* ===================== Temporizador visual ===================== */
setInterval(() => {
  if (!S) return;
  const rem = Math.max(0, S.phaseEndsAt - (Date.now() + offset));
  if (S.phase === 'ANSWERING') {
    const sec = Math.ceil(rem / 1000), tm = $('#tm');
    if (tm) { tm.textContent = sec; tm.classList.toggle('low', sec <= 5); }
    if (sec !== lastSec) { lastSec = sec; if (sec > 0 && sec <= 5) tone(900, .07, 'square', .06); }
  } else if (S.phase === 'READING') {
    const f = $('#rfill'); if (f && S.phaseMs) f.style.width = (rem / S.phaseMs * 100) + '%';
  }
}, 100);

// Keep-alive para el plan gratuito de Render (cada 4 minutos)
setInterval(() => fetch('/ping').catch(() => {}), 240000);
</script>
