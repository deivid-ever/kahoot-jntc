<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>JNTC Quiz · Jugar</title>
<style>
:root{--bg:#F4F7FB;--surface:#FFFFFF;--line:#DCE4F0;--navy:#111B54;--royal:#1565D8;--green:#236B28;--leaf:#5BA326;--red:#DC2626}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--navy);overflow:hidden;touch-action:manipulation}
.hide{display:none!important}
.view{height:100vh;height:100dvh;width:100%;display:flex;flex-direction:column}

/* Ingreso */
#login{align-items:center;justify-content:center;padding:18px}
.lcard{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 6px 20px rgba(17,27,84,.08);padding:24px 20px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px;text-align:center}
.logo{width:96px;height:96px;margin:0 auto}
.logo svg{width:100%;height:100%}
.brand-t{font-weight:800;line-height:1.15}
.brand-t .xx{color:var(--royal)}.brand-t .tc{display:block;color:var(--green);font-size:.95rem}
.lcard input{font:inherit;font-size:1.2rem;font-weight:700;text-align:center;padding:13px;border:2px solid var(--line);border-radius:12px;width:100%;color:var(--navy)}
.lcard input:focus{outline:none;border-color:var(--royal)}
#pin{letter-spacing:.3em}
#go{font:inherit;font-weight:900;font-size:1.15rem;color:#fff;background:var(--royal);border:0;border-bottom:5px solid rgba(0,0,0,.25);border-radius:14px;padding:14px;cursor:pointer}
#go:active{transform:translateY(3px);border-bottom-width:2px}
.err{color:var(--red);font-weight:700;min-height:1.3em;font-size:.95rem}

/* Mensajes */
.msg{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:24px}
.msg .big{font-size:2.6rem}
.msg h2{font-size:1.6rem;line-height:1.25}
.msg p{font-size:1.05rem;color:#55608a;font-weight:600}
.pill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 16px;font-weight:800}
.sp{width:70px;height:70px;border-radius:16px;color:#fff;display:flex;align-items:center;justify-content:center;font-size:2.4rem}

/* Respuesta */
.abar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#fff;font-weight:800;font-size:1.15rem;gap:10px}
.abar .score{background:var(--navy);color:#fff;border-radius:10px;padding:6px 16px;min-width:64px;text-align:center}
.abar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.agrid{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:10px;padding:10px;background:#fff}
.agrid button{border:0;border-bottom:8px solid rgba(0,0,0,.22);border-radius:14px;color:#fff;font-size:4.5rem;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.agrid button:active{transform:translateY(5px);border-bottom-width:3px}
.b0{background:var(--royal)}.b1{background:var(--green)}.b2{background:var(--navy)}.b3{background:var(--leaf)}
.white{background:#fff}

/* Resultado */
.res{color:#fff}
.res.ok{background:var(--green)}
.res.bad{background:var(--red)}
.res.neutral{background:var(--navy)}
.res .msg p{color:rgba(255,255,255,.92)}
.res .ico{font-size:5rem;font-weight:900;line-height:1}
.res .pts{background:rgba(255,255,255,.2);border-radius:999px;padding:8px 22px;font-size:1.6rem;font-weight:900}
.res .streak{font-weight:800;font-size:1.2rem}
.foot{padding:14px 18px calc(14px + env(safe-area-inset-bottom));text-align:center;font-weight:700;background:rgba(0,0,0,.18);color:#fff}
.res .tot{font-weight:800;opacity:.95}
</style>
</head>
<body>

<!-- Ingreso -->
<section class="view" id="login">
  <div class="lcard">
    <div class="logo" id="logo"></div>
    <div class="brand-t"><span class="xx">XX</span> Jornada Nacional<span class="tc">Técnico-Científica</span></div>
    <input id="pin" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="PIN de 6 dígitos" autocomplete="off">
    <input id="name" maxlength="20" placeholder="Apodo o nombre del equipo" autocomplete="off">
    <button id="go">¡Listo, entrar!</button>
    <div class="err" id="err"></div>
  </div>
</section>

<!-- Juego -->
<section class="view hide" id="game"></section>

<script src="/socket.io/socket.io.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SH = ['▲','◆','●','■'];
const KEY = 'jntc_player';

$('#logo').innerHTML = '<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg"><defs><clipPath id="lcb"><circle cx="60" cy="60" r="40"/></clipPath><path id="lpb" d="M17 60A43 43 0 0 1 103 60"/></defs>'
 +'<circle cx="60" cy="60" r="55" fill="none" stroke="#236B28" stroke-width="9" stroke-dasharray="8.6 6"/>'
 +'<circle cx="60" cy="60" r="47" fill="none" stroke="#236B28" stroke-width="14"/>'
 +'<text font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="12" fill="#111B54" stroke="#fff" stroke-width=".6" paint-order="stroke" letter-spacing="3"><textPath href="#lpb" startOffset="50%" text-anchor="middle">JNTC</textPath></text>'
 +'<circle cx="60" cy="60" r="40" fill="#fff"/>'
 +'<g clip-path="url(#lcb)"><path d="M20 92Q40 66 60 82T100 80V100H20Z" fill="#5BA326"/></g>'
 +'<rect x="53" y="30" width="14" height="52" rx="4" fill="#1565D8"/><rect x="50" y="26" width="20" height="8" rx="3" fill="#1565D8"/>'
 +'<rect x="55.5" y="50" width="9" height="9" rx="1" fill="#fff"/><path d="M58 50v-3M62 50v-3M58 59v3M62 59v3M55.5 53h-3M55.5 57h-3M64.5 53h3M64.5 57h3" stroke="#fff" stroke-width="1"/>'
 +'<polygon points="26,66 46,66 42,78 22,78" fill="#1565D8"/><path d="M32.5 66l-3 12M39 66l-3 12M24 72h20" stroke="#fff" stroke-width="1"/><path d="M34 78v6" stroke="#1565D8" stroke-width="2"/>'
 +'<path d="M84 80V64" stroke="#1565D8" stroke-width="2.5"/><path d="M84 68Q76 66 76 59Q84 59 84 68Z" fill="#1565D8"/><path d="M84 65Q92 63 92 56Q84 56 84 65Z" fill="#1565D8"/>'
 +'<path d="M90 98q17-2 19-19q-17 2-19 19z" fill="#5BA326"/></svg>';

let saved = null;
try { saved = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
const qp = new URLSearchParams(location.search);
if (qp.get('pin')) $('#pin').value = String(qp.get('pin')).replace(/\D/g, '').slice(0, 6);
else if (saved && saved.pin) $('#pin').value = saved.pin;
if (saved && saved.name) $('#name').value = saved.name;

let joined = false, S = null, localAns = -1, lastKey = '';
const socket = io();

function showView(v) {
  $('#login').classList.toggle('hide', v !== 'login');
  $('#game').classList.toggle('hide', v !== 'game');
}
function persist() { try { localStorage.setItem(KEY, JSON.stringify(saved)); } catch (e) {} }

function doJoin(pin, name, id, silent) {
  socket.emit('join', { pin, name, playerId: id }, res => {
    if (res && res.ok) {
      joined = true; saved = { id: res.playerId, name: res.name, pin: String(pin || (saved && saved.pin) || '') }; persist();
      $('#err').textContent = ''; showView('game'); requestWake(); lastKey = ''; render();
    } else {
      joined = false;
      if (silent) {
        saved = null; try { localStorage.removeItem(KEY); } catch (e) {}
        showView('login'); $('#err').textContent = 'La sala se reinició o cambió. Ingresa de nuevo.';
      } else $('#err').textContent = (res && res.error) || 'No se pudo entrar';
    }
  });
}
$('#go').addEventListener('click', () => {
  const pin = $('#pin').value.trim(), name = $('#name').value.trim();
  if (pin.length !== 6) return void ($('#err').textContent = 'El PIN tiene 6 dígitos');
  if (!name) return void ($('#err').textContent = 'Escribe tu apodo o nombre de equipo');
  $('#err').textContent = '';
  doJoin(pin, name, saved && saved.name === name ? saved.id : null, false);
});
$('#name').addEventListener('keydown', e => { if (e.key === 'Enter') $('#go').click(); });

socket.on('connect', () => { if (saved && saved.id) doJoin(saved.pin, saved.name, saved.id, true); });
socket.on('kicked', () => {
  joined = false; saved = null; try { localStorage.removeItem(KEY); } catch (e) {}
  showView('login'); $('#err').textContent = 'El moderador te sacó de la partida.';
});
socket.on('state', s => { S = s; if (joined) render(); });

// Evitar que la pantalla se apague
let wake = null;
async function requestWake() { try { if ('wakeLock' in navigator) wake = await navigator.wakeLock.request('screen'); } catch (e) {} }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && joined) requestWake(); });

function placeText(me) {
  if (me.rank === 1) return '¡Vas en 1.º lugar!';
  return 'Vas en ' + me.rank + '.º lugar' + (me.behind ? ' · Estás a ' + me.behind.diff + ' puntos de ' + esc(me.behind.name) : '');
}

function render() {
  const g = $('#game'); if (!S || !S.me) return;
  const me = S.me, ph = S.phase;
  if (ph !== 'ANSWERING') localAns = -1;
  const answered = me.answered || localAns === S.qNum;
  const L = me.last;
  const key = [ph, S.qNum, answered, me.score, me.rank, L ? L.points : '-', L ? L.correct : '-'].join('|');
  if (key === lastKey) return;
  lastKey = key;

  if (ph === 'LOBBY') {
    g.innerHTML = '<div class="msg"><div class="big">✅</div><h2>¡Ya estás dentro!</h2><p>Mira tu nombre en el proyector</p><span class="pill">' + esc(me.name) + '</span></div>';
  } else if (ph === 'GET_READY' || ph === 'READING') {
    g.innerHTML = '<div class="msg"><div class="big">👀</div><h2>Mira el proyector y lee la pregunta...</h2><p>Pregunta ' + S.qNum + ' de ' + S.qTotal + '</p></div>';
  } else if (ph === 'ANSWERING') {
    if (answered) {
      const c = me.choice != null ? me.choice : (window.__lastChoice != null ? window.__lastChoice : null);
      g.innerHTML = '<div class="msg">' + (c != null ? '<div class="sp b' + c + '">' + SH[c] + '</div>' : '') + '<h2>⏳ Respuesta enviada, esperando a los demás...</h2></div>';
    } else {
      g.innerHTML = '<div class="abar"><span>' + esc(S.pin) + '</span><span>' + S.qNum + ' de ' + S.qTotal + '</span></div>'
        + '<div class="agrid">' + [0, 1, 2, 3].map(i => '<button data-c="' + i + '" class="b' + i + '">' + SH[i] + '</button>').join('') + '</div>'
        + '<div class="abar"><span class="nm">' + esc(me.name) + '</span><span class="score">' + me.score + '</span></div>';
    }
  } else if (ph === 'QUESTION_RESULT' || ph === 'LEADERBOARD') {
    const wait = ph === 'LEADERBOARD' ? '<div class="foot">Esperando al moderador para la siguiente pregunta...</div>' : '';
    if (!L) {
      g.innerHTML = '<div class="res neutral view"><div class="msg"><h2>Resultados en el proyector</h2><p>' + placeText(me) + '</p></div>' + wait + '</div>';
    } else if (L.correct) {
      g.innerHTML = '<div class="res ok view"><div class="msg"><div class="ico">✓</div><h2>¡Correcto!</h2><div class="pts">+' + L.points + ' pts</div>'
        + (me.streak >= 2 ? '<div class="streak">🔥 Racha de ' + me.streak + '</div>' : '') + '<p>' + placeText(me) + '</p><div class="tot">Total: ' + me.score + ' pts</div></div>' + wait + '</div>';
    } else {
      g.innerHTML = '<div class="res bad view"><div class="msg"><div class="ico">✕</div><h2>' + (L.answered ? 'Incorrecto' : '¡Se acabó el tiempo!') + '</h2><div class="pts">+0 pts</div><p>' + placeText(me) + '</p><div class="tot">Total: ' + me.score + ' pts</div></div>' + wait + '</div>';
    }
  } else if (ph === 'PODIUM') {
    const medal = me.rank === 1 ? '🥇' : me.rank === 2 ? '🥈' : me.rank === 3 ? '🥉' : '🎉';
    g.innerHTML = '<div class="msg"><div class="big">' + medal + '</div><h2>¡Fin del juego!</h2><p>Terminaste en el ' + me.rank + '.º lugar de ' + me.players + '</p><span class="pill">' + me.score + ' pts</span></div>';
  }
}

$('#game').addEventListener('click', e => {
  const b = e.target.closest('button[data-c]'); if (!b || !S || S.phase !== 'ANSWERING') return;
  const c = +b.dataset.c;
  if (localAns === S.qNum) return;
  localAns = S.qNum; window.__lastChoice = c;
  if (navigator.vibrate) navigator.vibrate(100);
  lastKey = ''; render();
  socket.emit('answer', c, res => {
    if (!res || !res.ok) { if (S && S.me && !S.me.answered) { localAns = -1; } lastKey = ''; render(); }
  });
});
</script>
</body>
</html>
